<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propix LK - Launching Soon!</title>

    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <link href="assets/img/favicon.png" rel="icon">

    <style>
        /* Basic CSS Styles */
        body {
            font-family: 'Roboto', sans-serif; /* Default font */
            background-color: #ffffff; /* Your main.css --background-color */
            color: #444444; /* Your main.css --default-color */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            flex-direction: column; /* Arrange content vertically */
            overflow: hidden; /* Hide scrollbars if content slightly overflows during animation */
        }
        .container {
            background-color: #f6fafd; /* Similar to your light-background class --background-color */
            padding: 30px 40px;
            border-radius: 15px; /* Slightly more rounded */
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); /* Softer, larger shadow */
            max-width: 90%;
            width: 600px; /* Max width for the container */
        }
        .logo-img {
            width: 50px; /* Adjusted size */
            height: 50px;
            margin-bottom: 15px;
            opacity: 0; /* Initial state for animation */
            animation: fadeInSlideUp 0.8s ease-out 0.2s forwards;
        }
        h1 {
            color: #124265; /* Your main.css --heading-color */
            font-family: "Raleway", sans-serif; /* Your main.css --heading-font */
            font-size: 2.6em; /* Adjusted */
            margin-top: 0;
            margin-bottom: 15px;
            opacity: 0; /* Initial state for animation */
            animation: fadeInSlideUp 0.8s ease-out 0.5s forwards;
        }
        p.launch-text { /* Class for the main launch paragraph */
            font-size: 1.15em; /* Adjusted */
            margin-bottom: 20px;
            font-family: "Roboto", sans-serif;
            line-height: 1.6;
            opacity: 0; /* Initial state for animation */
            animation: fadeInSlideUp 0.8s ease-out 0.8s forwards;
        }
        #countdown-wrapper p.time-remaining-text { /* Class for "time remaining" text */
            font-size: 1em;
            margin-bottom: 15px;
            font-family: "Roboto", sans-serif;
            opacity: 0; /* Initial state for animation */
            animation: fadeInSlideUp 0.8s ease-out 1.1s forwards;
        }
        #countdown-wrapper {
            margin-bottom: 20px;
        }
        #countdown {
            font-size: 2em; /* Adjusted */
            font-weight: 700; /* Bolder numbers */
            color: #2487ce; /* Your main.css --accent-color */
            font-family: "Poppins", sans-serif; /* Your main.css --nav-font */
        }
        #countdown > div { /* Separate boxes for days, hours, minutes, seconds */
            display: inline-block;
            padding: 12px 18px; /* Adjusted padding */
            background-color: #ffffff; /* Your main.css --surface-color */
            border-radius: 8px; /* More rounded */
            margin: 0 6px; /* Adjusted margin */
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); /* Enhanced shadow */
            min-width: 70px; /* Ensure boxes have some minimum width */
            opacity: 0; /* Initial state for animation */
            animation: fadeInSlideUpBox 0.8s ease-out 1.4s forwards;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        #countdown > div:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.12);
        }
        #countdown span.value { /* The number span */
            display: block;
            line-height: 1.2; /* Ensure numbers are centered well */
        }
        .unit { /* The unit (Days, Hours) */
            font-size: 0.38em; /* Adjusted */
            font-weight: 500; /* Medium weight */
            display: block;
            color: #6c757d; /* Bootstrap's text-muted color, good for subtext */
            text-transform: uppercase;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }
        .footer-credit {
            margin-top: 30px;
            font-size: 0.85em; /* Adjusted */
            color: #777;
            font-family: "Roboto", sans-serif;
            opacity: 0; /* Initial state for animation */
            animation: fadeInSlideUp 0.8s ease-out 1.7s forwards;
        }
        .footer-credit a {
            color: #124265; /* --heading-color */
            text-decoration: none;
            font-weight: 500;
        }
        .footer-credit a:hover {
            text-decoration: underline;
        }

        /* Keyframes for entrance animations */
        @keyframes fadeInSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInSlideUpBox {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Animation for number pop */
        .animate-pop {
            animation: popEffect 0.35s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        @keyframes popEffect {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            h1 { font-size: 2.2em; }
            p.launch-text { font-size: 1.05em; }
            #countdown { font-size: 1.6em; }
            #countdown > div { min-width: 60px; padding: 10px 15px; margin: 0 4px;}
            .container { padding: 25px 30px; }
        }
        @media (max-width: 480px) {
            .container { padding: 20px; width: auto; margin-left:15px; margin-right:15px; }
            h1 { font-size: 1.9em; }
            p.launch-text { font-size: 1em; }
            #countdown { font-size: 1.3em; }
            #countdown > div {
                display: block;
                margin: 8px auto; /* Stack vertically with space */
                width: 50%; /* Adjust width for stacked items */
                min-width: 100px;
            }
            .logo-img { width: 40px; height: 40px; margin-bottom:10px;}
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="assets/img/favicon.png" alt="Propix LK Logo" class="logo-img">
        <h1>Propix LK</h1>
        <p class="launch-text">Our new website <strong>propix.work.gd</strong><br>is getting ready to launch Soon!</p>
        <div id="countdown-wrapper">
            <p class="time-remaining-text" style="font-size:1em; margin-bottom:15px;">Time remaining until launch:</p>
            <div id="countdown">
                <div id="days-container">
                    <span class="value" id="days">0</span>
                    <span class="unit">Days</span>
                </div>
                <div id="hours-container">
                    <span class="value" id="hours">0</span>
                    <span class="unit">Hours</span>
                </div>
                <div id="minutes-container">
                    <span class="value" id="minutes">0</span>
                    <span class="unit">Minutes</span>
                </div>
                <div id="seconds-container">
                    <span class="value" id="seconds">0</span>
                    <span class="unit">Seconds</span>
                </div>
            </div>
        </div>
    </div>
    <div class="footer-credit">
        <a href="https://wa.me/message/JGOBR5KKO5UAF1" target="_blank" rel="noopener noreferrer">Propix LK Development Team</a>
    </div>

    <script>
        // Countdown JavaScript code
        const countdownDate = new Date("June 1, 2025 00:00:00").getTime(); // Your launch date and time

        function updateElementWithAnimation(elementId, value) {
            const element = document.getElementById(elementId);
            if (!element) return;

            const currentValue = element.innerText;
            const newValue = value.toString();

            if (currentValue !== newValue) {
                // Apply the new value
                element.innerText = newValue;

                // Restart the pop animation
                element.classList.remove('animate-pop');
                // void element.offsetWidth; // Force reflow to restart animation
                // Using a short timeout is often more reliable for restarting CSS animations
                setTimeout(() => {
                    element.classList.add('animate-pop');
                }, 10); // Small delay
                 // Remove class after animation finishes to allow it to re-trigger
                setTimeout(() => {
                   if (element) element.classList.remove('animate-pop');
                }, 360); // Duration of popEffect animation (0.35s) + small buffer

            } else if (!element.classList.contains('animate-pop') && elementId ==='seconds') {
                // For seconds, always apply a subtle animation if not already popping
                // to show it's "ticking" even if the number itself (0-9) hasn't changed for a moment
                 element.classList.add('animate-pop');
                 setTimeout(() => {
                    if (element) element.classList.remove('animate-pop');
                 }, 360);
            }
        }


        const countdownFunction = setInterval(function() {
            const now = new Date().getTime();
            const distance = countdownDate - now;

            if (distance < 0) {
                clearInterval(countdownFunction);
                const countdownWrapper = document.getElementById("countdown-wrapper");
                if (countdownWrapper) {
                    countdownWrapper.innerHTML = "<p style='font-size:1.5em; color: #059652;'>Our website has launched!</p><p><a href='https://propix.work.gd/' style='font-size:1.2em; color: #2487ce; text-decoration:none; font-weight:bold;'>Visit Site</a></p>";
                }
                // Ensure main container items like H1 are still visible if countdown disappears
                const mainContainer = document.querySelector('.container');
                if(mainContainer){
                    // Adjust styling if necessary, e.g. remove padding that was for countdown
                }
                return;
            }

            // Time calculations
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Display the result in the elements
            updateElementWithAnimation("days", days);
            updateElementWithAnimation("hours", hours);
            updateElementWithAnimation("minutes", minutes);
            updateElementWithAnimation("seconds", seconds);

        }, 1000);

        // Initial call to set values immediately without waiting for 1 sec
        // (This part could be wrapped in a function and called once on load)
        const initialNow = new Date().getTime();
        const initialDistance = countdownDate - initialNow;
        if (initialDistance > 0) {
            document.getElementById("days").innerText = Math.floor(initialDistance / (1000 * 60 * 60 * 24));
            document.getElementById("hours").innerText = Math.floor((initialDistance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById("minutes").innerText = Math.floor((initialDistance % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById("seconds").innerText = Math.floor((initialDistance % (1000 * 60)) / 1000);
        } else {
             // Handle case where page loads after launch
             const countdownWrapper = document.getElementById("countdown-wrapper");
             if (countdownWrapper) {
                countdownWrapper.innerHTML = "<p style='font-size:1.5em; color: #059652;'>Our website has launched!</p><p><a href='https://propix.work.gd/' style='font-size:1.2em; color: #2487ce; text-decoration:none; font-weight:bold;'>Visit Site</a></p>";
             }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Section - Login / Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column; /* Allow content to stack vertically, including bottom buttons */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0; /* Add some padding to body for better spacing of elements */
            color: #333;
        }

        .auth-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
            /* position: relative; /* No longer needed for top arrow */
        }

        .auth-container h2 {
            margin-bottom: 30px;
            color: #2487ce;
            font-weight: 700;
        }

        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .tab-button {
            background-color: transparent;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            color: #777;
            transition: color 0.3s ease, border-bottom 0.3s ease;
            margin: 0 10px;
        }

        .tab-button.active {
            color: #2487ce;
            border-bottom: 2px solid #2487ce;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        .form-control {
            width: calc(100% - 20px); /* For general form-controls */
            padding: 12px 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            border-color: #2487ce;
            outline: none;
            box-shadow: 0 0 0 0.2rem rgba(36, 135, 206, 0.25);
        }

        .password-input-container {
            position: relative;
        }
        /* For form-control within a password-input-container */
        .password-input-container .form-control {
            width: 100%; /* Take full width of the container */
            padding-right: 45px; /* Make space for the icon on the right */
        }
        .password-toggle-icon {
            position: absolute;
            right: 15px; /* Position of the icon from the right edge */
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            user-select: none; /* Prevent text selection on icon click */
            font-size: 18px; /* Icon size */
        }

        button.btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #2487ce;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button.btn-primary:hover {
            background-color: #1a6bb2;
        }

        .message {
            margin-top: 20px;
            font-weight: 500;
            padding: 10px;
            border-radius: 5px;
        }

        .message.info {
            background-color: #e0f2f7;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }
        
        .form-text-error { /* Class for email validation error message */
            font-size: 0.875em;
            color: red;
            display: none; /* Hidden by default */
            margin-top: 4px;
        }

        /* Styles for bottom navigation buttons */
        .bottom-nav-buttons {
            text-align: center;
            margin-top: 30px; /* Space above the buttons */
            width: 100%;
            max-width: 450px; /* Match auth-container width */
        }

        .bottom-nav-buttons .btn-nav,
        .bottom-nav-buttons a.btn-nav {
            background-color: #6c757d; /* Secondary button color */
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 5px 10px; /* Space around buttons */
            min-width: 100px; /* Minimum width for buttons */
            transition: background-color 0.3s ease;
        }

        .bottom-nav-buttons .btn-nav:hover,
        .bottom-nav-buttons a.btn-nav:hover {
            background-color: #5a6268; /* Darker shade on hover */
        }
        /* End of bottom navigation button styles */

        @media (max-width: 500px) {
            .auth-container {
                margin: 20px auto 0 auto; /* Adjusted margin for body padding */
                padding: 30px 20px;
            }
            .bottom-nav-buttons {
                margin-top: 20px;
            }
            .bottom-nav-buttons .btn-nav,
            .bottom-nav-buttons a.btn-nav {
                padding: 10px 15px; /* Slightly less padding */
                font-size: 15px;
                margin: 8px 5px; /* Adjust margin for stacking */
                width: calc(50% - 15px); /* Two buttons side-by-side with gap */
                box-sizing: border-box;
            }
             /* If you want them to stack on very small screens: */
            @media (max-width: 360px) {
                .bottom-nav-buttons .btn-nav,
                .bottom-nav-buttons a.btn-nav {
                    width: calc(100% - 20px);
                    margin-left: 10px;
                    margin-right: 10px;
                }
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Gift Section</h2>

        <div class="tabs">
            <button class="tab-button active" data-tab="login">Login</button>
            <button class="tab-button" data-tab="signup">Sign Up</button>
        </div>

        <form id="loginForm" class="auth-form active">
            <div class="form-group">
                <label for="loginUsername">Username / Email</label>
                <input type="text" id="loginUsername" class="form-control" placeholder="Enter your username or email" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="password-input-container">
                    <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
                    <span id="toggleLoginPassword" class="password-toggle-icon">👁️</span>
                </div>
            </div>
            <button type="submit" class="btn-primary">Login</button>
            <div id="loginResponseMessage" class="message" style="display: none;"></div>
        </form>

        <form id="signupForm" class="auth-form">
            <div class="form-group">
                <label for="signupUsername">Username</label>
                <input type="text" id="signupUsername" class="form-control" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label for="signupEmail">Email</label>
                <input type="email" id="signupEmail" class="form-control" placeholder="Enter your email" required>
                <small id="emailValidationMessage" class="form-text-error"></small> </div>
            <div class="form-group">
                <label for="signupPassword">Password</label>
                <div class="password-input-container">
                    <input type="password" id="signupPassword" class="form-control" placeholder="Create a password" required>
                    <span id="toggleSignupPassword" class="password-toggle-icon">👁️</span>
                </div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-input-container">
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password" required>
                    <span id="toggleConfirmPassword" class="password-toggle-icon">👁️</span>
                </div>
            </div>
            <button type="submit" class="btn-primary">Sign Up</button>
            <div id="signupResponseMessage" class="message" style="display: none;"></div>
        </form>
    </div>

    <div class="bottom-nav-buttons">
        
        <a href="index.html" class="btn-nav">Home</a>
    </div>
    <script>
        // Your Google App Script URL.
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbzOUCuK4Glg3DRNlWcV70sLP24N-HizILmacJrs2Fogn41g_uZ8VIcd68g2TOfXxq7g/exec';

        // Function to go back in history
        function goBack() {
            window.history.back();
        }

        // Function to display messages
        function displayMessage(messageDiv, message, type) {
            messageDiv.style.display = 'block';
            messageDiv.classList.remove('success', 'error', 'info');
            messageDiv.classList.add(type);
            messageDiv.textContent = message;
        }

        // --- Tab Switching Logic ---
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', function() {
                document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
                
                this.classList.add('active');
                const targetTab = this.dataset.tab;
                document.getElementById(targetTab + 'Form').classList.add('active');

                document.getElementById('loginResponseMessage').style.display = 'none';
                document.getElementById('signupResponseMessage').style.display = 'none';
                if(document.getElementById('emailValidationMessage')) { 
                     document.getElementById('emailValidationMessage').style.display = 'none'; 
                }
            });
        });

        // --- Password Toggle Functionality ---
        function setupPasswordToggle(inputId, toggleId) {
            const passwordInput = document.getElementById(inputId);
            const togglePassword = document.getElementById(toggleId);

            if (passwordInput && togglePassword) {
                togglePassword.addEventListener('click', function () {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    this.textContent = type === 'password' ? '👁️' : '🙈';
                });
            }
        }
        
        // --- Email Validation Function ---
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        document.addEventListener('DOMContentLoaded', function() {
            setupPasswordToggle('loginPassword', 'toggleLoginPassword');
            setupPasswordToggle('signupPassword', 'toggleSignupPassword');
            setupPasswordToggle('confirmPassword', 'toggleConfirmPassword');

            const signupEmailInput = document.getElementById('signupEmail');
            const emailValidationMessageEl = document.getElementById('emailValidationMessage');

            if (signupEmailInput && emailValidationMessageEl) {
                signupEmailInput.addEventListener('input', function() { 
                    if (signupEmailInput.value.length > 0 && !isValidEmail(signupEmailInput.value)) {
                        emailValidationMessageEl.textContent = 'Please enter a valid email address (e.g., name@example.com).';
                        emailValidationMessageEl.style.display = 'block';
                    } else {
                        emailValidationMessageEl.style.display = 'none';
                    }
                });
            }
        });

        // --- Login Form Submission ---
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const responseMessageDiv = document.getElementById('loginResponseMessage');
            displayMessage(responseMessageDiv, 'Logging in...', 'info');
            const data = { action: 'login', username: username, password: password };

            fetch(scriptUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded', },
                body: new URLSearchParams(data).toString(),
            })
            .then(response => {
                if (response.ok) return response.json();
                return response.json().then(errData => { throw new Error(errData.message || `HTTP error! status: ${response.status}`); })
                                 .catch(() => { throw new Error(`HTTP error! status: ${response.status}`); });
            })
            .then(data => {
                if (data && data.status === 'success') {
                    displayMessage(responseMessageDiv, data.message || 'Login successful! Redirecting...', 'success');
                    setTimeout(() => { window.location.href = 'gift-section.html'; }, 1500);
                } else {
                    displayMessage(responseMessageDiv, data.message || 'Login failed. Please try again.', 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                displayMessage(responseMessageDiv, error.message || 'An error occurred during login. Please try again later.', 'error');
            });
        });

        // --- Sign Up Form Submission ---
        document.getElementById('signupForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const username = document.getElementById('signupUsername').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const responseMessageDiv = document.getElementById('signupResponseMessage');
            const emailValidationMessageEl = document.getElementById('emailValidationMessage');

            if (!isValidEmail(email)) {
                if (emailValidationMessageEl) {
                    emailValidationMessageEl.textContent = 'Please enter a valid email address (e.g., name@example.com).';
                    emailValidationMessageEl.style.display = 'block';
                }
                displayMessage(responseMessageDiv, 'Please enter a valid email address.', 'error');
                return; 
            } else {
                 if (emailValidationMessageEl) emailValidationMessageEl.style.display = 'none'; 
            }

            if (password !== confirmPassword) {
                displayMessage(responseMessageDiv, 'Passwords do not match.', 'error');
                return;
            }

            displayMessage(responseMessageDiv, 'Signing up...', 'info');
            const data = { action: 'signup', username: username, email: email, password: password };

            fetch(scriptUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded', },
                body: new URLSearchParams(data).toString(),
            })
            .then(response => {
                if (response.ok) return response.json();
                return response.json().then(errData => { throw new Error(errData.message || `HTTP error! status: ${response.status}`); })
                                 .catch(() => { throw new Error(`HTTP error! status: ${response.status}`); });
            })
            .then(data => {
                if (data && data.status === 'success') {
                    displayMessage(responseMessageDiv, data.message || 'Sign up successful! Redirecting...', 'success');
                    setTimeout(() => { window.location.href = 'gift-section.html'; }, 1500);
                } else {
                    displayMessage(responseMessageDiv, data.message || 'Sign up failed. Please try again.', 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                displayMessage(responseMessageDiv, error.message || 'An error occurred during sign up. Please try again later.', 'error');
            });
        });
    </script>
</body>
</html>

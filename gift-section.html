<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Updates Soon - Propix Lk</title>
  <meta name="description" content="Propix Lk is currently undergoing updates. Please check back soon!">
  <meta name="keywords" content="updates, maintenance, propix lk, coming soon">

  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">

  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/aos/aos.css" rel="stylesheet">
  <link href="assets/vendor/glightbox/css/glightbox.min.css" rel="stylesheet">
  <link href="assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet">

  <link href="assets/css/main.css" rel="stylesheet">

  <style>
    body {
      display: flex;
      flex-direction: column; /* Allow content and buttons to stack vertically */
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      background-color: var(--background-color); /* From main.css */
      color: var(--default-color); /* From main.css */
      font-family: var(--default-font); /* From main.css */
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      max-width: 600px;
      padding: 40px;
      border-radius: 8px;
      background-color: var(--surface-color); /* From main.css */
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px; /* Space between content and buttons */
    }

    h1 {
      font-size: 2.5em;
      color: var(--heading-color); /* From main.css */
      margin-bottom: 20px;
    }

    p {
      font-size: 1.1em;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .contact-info {
      margin-top: 30px;
      font-size: 0.9em;
      color: #666;
    }

    .contact-info a {
      color: var(--accent-color); /* From main.css */
      text-decoration: none;
    }

    .contact-info a:hover {
      text-decoration: underline;
    }

    .buttons-container {
      display: flex;
      gap: 15px; /* Space between buttons */
      justify-content: center;
      margin-top: 20px;
    }

    .buttons-container .btn {
      padding: 10px 25px;
      font-size: 1em;
      border-radius: 5px;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .buttons-container .btn-primary {
      background-color: var(--accent-color); /* Primary button color */
      color: #fff;
      border: 1px solid var(--accent-color);
    }

    .buttons-container .btn-primary:hover {
      background-color: color-mix(in srgb, var(--accent-color), black 10%); /* Darker on hover */
      border-color: color-mix(in srgb, var(--accent-color), black 10%);
    }

    .buttons-container .btn-secondary {
      background-color: transparent;
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
    }

    .buttons-container .btn-secondary:hover {
      background-color: var(--accent-color);
      color: #fff;
    }

    /* Dark Mode Adjustments for this page */
    body.dark-mode .container {
      background-color: var(--surface-color); /* Should already be darker in main.css for dark mode */
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }
    body.dark-mode h1 {
        color: #f0f0f0; /* Lighter heading color for dark mode */
    }
    body.dark-mode p, body.dark-mode .contact-info {
        color: #ccc; /* Lighter text color for dark mode */
    }
    body.dark-mode .contact-info a {
      color: var(--accent-color); /* Still accent color, but ensure good contrast */
    }
    body.dark-mode .buttons-container .btn-secondary {
      color: var(--accent-color);
      border-color: var(--accent-color);
    }
    body.dark-mode .buttons-container .btn-secondary:hover {
      background-color: var(--accent-color);
      color: #fff;
    }
  </style>
</head>

<body>

  <div class="container" data-aos="fade-up" data-aos-delay="100">
    <h1>Our Website is Undergoing Updates!</h1>
    <p>Our website is currently undergoing maintenance and updates to bring you a better experience. We are working hard to improve our services.</p>
    <p>Please check back soon. Thank you for your patience!</p>
    
  </div>

  <div class="buttons-container" data-aos="fade-up" data-aos-delay="200">
    <button class="btn btn-secondary" onclick="history.back()">Go Back</button>
    <a href="index.html" class="btn btn-primary">Go to Home</a>
  </div>

  <script src="assets/vendor/aos/aos.js"></script>
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/glightbox/js/glightbox.min.js"></script>
  <script src="assets/vendor/purecounter/purecounter_vanilla.js"></script>
  <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>

  <script>
    AOS.init({
      duration: 1000,
      easing: 'ease-in-out',
      once: true,
      mirror: false
    });
  </script>

</body>

</html>
